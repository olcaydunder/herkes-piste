<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4A22D4">
<title>Herkes Piste</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/ikon-192.png">
<link rel="apple-touch-icon" href="/ikon-192.png">
<style>
@font-face{font-family:'Baloo 2';font-weight:600;font-display:block;src:url('/fonts/baloo-2-latin-ext-600-normal.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Baloo 2';font-weight:600;font-display:block;src:url('/fonts/baloo-2-latin-600-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Baloo 2';font-weight:800;font-display:block;src:url('/fonts/baloo-2-latin-ext-800-normal.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Baloo 2';font-weight:800;font-display:block;src:url('/fonts/baloo-2-latin-800-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html,body{margin:0;padding:0;height:100%;background:#4A22D4;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0}
#giris{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;box-sizing:border-box;background:#1B1040;color:#fff;font-family:'Baloo 2',system-ui,sans-serif;text-align:center;z-index:5}
#giris img{width:132px;height:132px;border-radius:50%;box-shadow:0 0 0 6px #fff}
#giris h1{margin:0;font-weight:800;font-size:44px;line-height:1}
#giris ol{margin:0;padding:0 0 0 22px;text-align:left;font-weight:600;font-size:19px;line-height:1.45;max-width:420px;color:#E7E0FF}
#giris ol b{color:#FFD23F}
#baslat{appearance:none;border:0;border-radius:999px;background:#FFD23F;color:#1B1040;font:800 30px 'Baloo 2',system-ui,sans-serif;padding:16px 56px 12px;box-shadow:0 8px 0 #F5A70C;cursor:pointer}
#baslat:active{transform:translateY(4px);box-shadow:0 4px 0 #F5A70C}
#secenekler{display:flex;flex-direction:column;gap:10px}
.satir{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px}
.satir input{width:24px;height:24px;accent-color:#FFD23F}
#hesap{margin:0;font-weight:600;font-size:17px;color:#9C8FD9}
#sesAc{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);white-space:nowrap;border:0;border-radius:999px;background:#FFD23F;color:#1B1040;font:800 24px 'Baloo 2',system-ui,sans-serif;padding:12px 30px 8px;box-shadow:0 6px 0 #F5A70C;display:none;z-index:6;cursor:pointer}
#tamEkran{position:fixed;right:10px;bottom:10px;width:46px;height:46px;border-radius:12px;border:0;background:rgba(27,16,64,.55);color:#fff;font:800 22px system-ui;display:none;z-index:4;cursor:pointer}
</style>
</head>
<body>
<canvas id="oyun" aria-label="Herkes Piste oyun ekranı"></canvas>
<button id="tamEkran" type="button" aria-label="Tam ekrana geç">⤢</button>
<button id="sesAc" type="button">Sesi açmak için dokun</button>
<div id="giris">
  <img src="/profil.png" alt="">
  <h1>HERKES PİSTE</h1>
  <ol>
    <li>Aşağıdaki <b>BAŞLAT</b>'a dokun, oyun tam ekran açılır.</li>
    <li>TikTok'u aç: <b>+</b> → <b>CANLI</b> → <b>Mobil oyun</b> → <b>Canlı yayına başla</b>, ekran paylaşımına izin ver.</li>
    <li>Chrome'a geri dön. Oyun yayına birkaç saniyede kendiliğinden bağlanır.</li>
  </ol>
  <div id="secenekler">
    <label class="satir"><input type="checkbox" id="spikerKutu" checked> Yapay zekâ sunucu konuşsun</label>
    <label class="satir"><input type="checkbox" id="sesKutu" checked> Davul sesi açık</label>
  </div>
  <p id="hesap">Sunucuya bağlanılıyor…</p>
  <button id="baslat" type="button">BAŞLAT</button>
</div>
<script src="/sorular.js"></script>
<script src="/oyun.js"></script>
</body>
</html>
